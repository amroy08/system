<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f2248" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MVHS ERP" />
    <meta name="application-name" content="MVHS ERP" />
    <meta name="description" content="M.V High School Management ERP - Students, Parents, Attendance, Fees & Homework Portal" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" />
    <title>M.V High School ERP</title>
  </head>
  <body>
    <div id="root">
      <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#09152e 0%,#0f2248 50%,#1e3a8a 100%);font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;color:#fff;z-index:999999;">
        <div style="position:relative;width:88px;height:88px;margin-bottom:22px;display:flex;align-items:center;justify-content:center;">
          <img src="/logo.jpeg" alt="M.V High School" style="width:76px;height:76px;object-fit:contain;background:#ffffff;padding:4px;border-radius:20px;box-shadow:0 16px 36px rgba(0,0,0,0.35),0 0 0 2px rgba(255,255,255,0.25);position:relative;z-index:2;" onerror="this.style.display='none';document.getElementById('mv-init-fallback').style.display='flex';" />
          <div id="mv-init-fallback" style="display:none;width:76px;height:76px;background:rgba(255,255,255,0.12);border:2px solid rgba(255,255,255,0.25);border-radius:20px;align-items:center;justify-content:center;position:relative;z-index:2;">
            <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
              <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
            </svg>
          </div>
          <div style="position:absolute;inset:-6px;border-radius:26px;border:2px solid rgba(56,189,248,0.5);animation:mvInitPulse 2s cubic-bezier(0.4,0,0.6,1) infinite;"></div>
        </div>
        <div style="font-size:19px;font-weight:900;letter-spacing:0.8px;margin:0 0 5px;text-shadow:0 2px 10px rgba(0,0,0,0.3);">M.V HIGH SCHOOL</div>
        <div style="font-size:11.5px;font-weight:700;letter-spacing:1.6px;color:#93c5fd;text-transform:uppercase;margin:0 0 26px;opacity:0.9;">SCHOOL MANAGEMENT SYSTEM</div>
        <div style="width:170px;height:4px;background:rgba(255,255,255,0.16);border-radius:999px;overflow:hidden;position:relative;margin-bottom:12px;">
          <div style="position:absolute;top:0;left:0;bottom:0;width:45%;background:linear-gradient(90deg,#38bdf8,#818cf8);border-radius:999px;box-shadow:0 0 12px rgba(56,189,248,0.7);animation:mvInitSlide 1.3s cubic-bezier(0.65,0,0.35,1) infinite;"></div>
        </div>
        <span style="font-size:12px;font-weight:600;color:#cbd5e1;letter-spacing:0.2px;">Starting portal...</span>
        <style>
          @keyframes mvInitPulse{0%,100%{transform:scale(1);opacity:0.7}50%{transform:scale(1.12);opacity:0}}
          @keyframes mvInitSlide{0%{transform:translateX(-100%)}50%{transform:translateX(180%)}100%{transform:translateX(350%)}}
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
